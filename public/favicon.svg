<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d"/>
      <stop offset="100%" stop-color="#162038"/>
    </linearGradient>
    <filter id="glow-x" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <filter id="glow-o" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  <rect width="64" height="64" rx="14" fill="url(#bg)" stroke="#1e2942" stroke-width="2"/>
  <!-- Neon X -->
  <path d="M14 16 L32 34 M32 16 L14 34" stroke="#00f0ff" stroke-width="4.5" stroke-linecap="round" filter="url(#glow-x)"/>
  <!-- Neon O -->
  <circle cx="44" cy="42" r="9" stroke="#b026ff" stroke-width="4.5" fill="none" filter="url(#glow-o)"/>
</svg>